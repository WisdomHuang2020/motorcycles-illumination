<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 与 src/router.ts 的 SITE_NAME 保持一致：首屏 <title> 与 React 挂载后
         写入的 title 相同，避免切换时出现一次标题跳变。 -->
    <title>二轮车照明配光技术站</title>
    <meta
      name="description"
      content="基于内部培训资料构建的二轮车照明配光技术知识站：GB 19152-2025 与 GB/T 31887.1-2019 逐表速查、配光屏交互、设计全流程、测试照准、研发内控与自测。"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <!--
      站群 8 色主题首屏防闪（与 main-website-entrance / llc-design-tool 同一套契约）：
        ?theme= 优先 → localStorage['pk-theme'] → 非法值一律回落默认（深墨 teal）。
      校验规则必须与 src/theme.ts 的 THEMES 完全一致。
      必须在 body 渲染前执行；组件挂载晚于首次绘制，放那里会先闪一下默认配色。
    -->
    <script>
      (function () {
        var IDS = ['dark-teal', 'blue', 'navy-tech', 'graphite', 'warm-paper', 'forest', 'indigo', 'sea-salt']
        var BG = {
          'dark-teal': '#0a0a0a', blue: '#f6f7f9', 'navy-tech': '#0b1a2b', graphite: '#f2f3f5',
          'warm-paper': '#faf6ed', forest: '#0c1712', indigo: '#f6f5fc', 'sea-salt': '#eef7f7',
        }
        try {
          var q = new URLSearchParams(location.search).get('theme')
          var v = IDS.indexOf(q) >= 0 ? q : localStorage.getItem('pk-theme')
          if (IDS.indexOf(v) >= 0) {
            document.documentElement.dataset.theme = v
            var m = document.querySelector('meta[name="theme-color"]')
            if (m && BG[v]) m.setAttribute('content', BG[v])
          }
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
