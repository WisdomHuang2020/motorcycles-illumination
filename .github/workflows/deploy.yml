name: Deploy · motorcycles illumination

# push main 自动部署；纯文档 / 审计脚本 / v1 遗留静态源码不触发。
# VERSION 必须参与触发：它决定随产物写入的 .deployed-version，门户据此显示实时版本。
# DNS 与证书异常时本工作流仍可部署，健康检查用 Host 头回环，不依赖公网解析。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'scripts/**'
      - 'assets/**'
  workflow_dispatch:

concurrency:
  group: deploy-motor-lighting
  cancel-in-progress: false

env:
  # 站群统一前缀 LH_*（Lighthouse），与 control-mode / 主入口一致。
  # 回退链 `secrets.LH_X || secrets.DEPLOY_X` 是过渡期兼容：新 secret 配好前仍用旧值，
  # 配好后本文件再收紧为 ${{ secrets.LH_X }}，旧的三条即可在页面上删除。
  LH_HOST: ${{ secrets.LH_HOST || secrets.DEPLOY_HOST }}
  LH_USER: ${{ secrets.LH_USER || secrets.DEPLOY_USER }}
  # 目标目录与端口在多数派里也走 secret；未配置时回落到本站固定值，
  # 避免空值把产物写进 / 或落到非预期目录。
  LH_ROOT: ${{ secrets.LH_ROOT || '/var/www/motor-lighting' }}
  LH_PORT: ${{ secrets.LH_PORT || '22' }}
  CANONICAL_HOST: www.motor-lighting.power-knowledge.tech

jobs:
  deploy:
    name: npm build → upload → atomic switch → verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Build artifact and compute tree fingerprint
        shell: bash
        run: |
          set -euo pipefail
          # VERSION 是版本号单一来源；package.json 必须同步，否则页脚与门户版本号会漂移。
          node -e "const fs=require('fs');const p=require('./package.json');const v=fs.readFileSync('VERSION','utf8').trim();if(p.version!==v){console.error('VERSION ('+v+') != package.json ('+p.version+')');process.exit(1)}"
          # 门户 /api/version/<id> 读取 web_root/.deployed-version。随产物一起打包，
          # 才能让构建端与服务器端的目录树指纹包含同一个文件、两端一致。
          printf '%s\n' "$(cat VERSION)" > dist/.deployed-version
          rm -f site.tar.gz
          # 中文图片文件名在 zh_CN.UTF-8 与 C.UTF-8 下排序结果不同，必须固定 LC_ALL=C，
          # 否则同一批文件在 runner 与服务器上会算出不同的目录树指纹（假红）。
          (cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1) > dist.sha256
          tar -czf site.tar.gz -C dist .
          echo "LOCAL_SHA=$(cat dist.sha256)" >> "$GITHUB_ENV"
          echo "artifact: $(find dist -type f | wc -l) files, $(du -sh dist | cut -f1), tree=$(cat dist.sha256), version=$(cat VERSION)"

      - name: Prepare SSH key
        env:
          # 多行私钥必须经 env 注入；直接写进 run 脚本文本会破坏 shell 语法。
          # 私钥只在需要它的这一步可见，不放 job 级 env。
          LH_SSH_KEY: ${{ secrets.LH_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LH_HOST"    || { echo "::error::secret LH_HOST is missing"; exit 1; }
          test -n "$LH_USER"    || { echo "::error::secret LH_USER is missing"; exit 1; }
          test -n "$LH_SSH_KEY" || { echo "::error::secret LH_SSH_KEY is missing"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$LH_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$LH_PORT" -H "$LH_HOST" >> ~/.ssh/known_hosts
          # ssh 与 scp 的端口参数**大小写不同**：ssh 是 -p，scp 是 -P。
          # 混用会让 scp 把端口号当成源文件名（-p 在 scp 里是"保留时间戳"且不接参数），
          # 所以这里拆成两个变量，各给各自的命令用。
          COMMON="-i $HOME/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15"
          echo "SSH_OPTS=$COMMON -p $LH_PORT" >> "$GITHUB_ENV"
          echo "SCP_OPTS=$COMMON -P $LH_PORT" >> "$GITHUB_ENV"

      - name: Upload tarball
        shell: bash
        run: |
          set -euo pipefail
          scp $SCP_OPTS site.tar.gz "$LH_USER@$LH_HOST:/tmp/motor-lighting-site.tar.gz"
          echo "uploaded sha256=$(sha256sum site.tar.gz | cut -d' ' -f1)"

      - name: Atomic switch on Lighthouse
        shell: bash
        run: |
          set -euo pipefail
          # heredoc 保持 quoted，避免本地把远端变量（$STAGE / $TS）提前展开成空；
          # 需要在远端使用的目标目录改为位置参数传入（bash -s -- "$LH_ROOT"）。
          ssh $SSH_OPTS "$LH_USER@$LH_HOST" bash -s -- "$LH_ROOT" <<'REMOTE'
          set -euo pipefail
          WEBROOT="$1"
          # 暂存目录与 webroot 同父级，保证 mv 是同一文件系统内的原子重命名
          BASE=$(dirname "$WEBROOT")
          STAGE=$(mktemp -d "$BASE/.motor-lighting-stage.XXXXXX")
          trap 'rm -rf "$STAGE"' EXIT
          tar -xzf /tmp/motor-lighting-site.tar.gz -C "$STAGE"
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          if [ -d "$WEBROOT" ]; then
            cp -a "$WEBROOT" "$BASE/.motor-lighting-backup-$TS"
            # 上一次部署留下的 .old 若仍存在，mv 会把当前目录嵌套进去而非替换，
            # 导致回滚目录逐次堆叠；已有带时间戳的备份，这里可安全清理。
            rm -rf "$WEBROOT.old"
            mv "$WEBROOT" "$WEBROOT.old"
          fi
          mv "$STAGE" "$WEBROOT"
          chown -R www-data:www-data "$WEBROOT"
          chmod -R a=rX,u+w "$WEBROOT"
          nginx -t
          systemctl reload nginx
          rm -f /tmp/motor-lighting-site.tar.gz
          echo "SWITCH_OK webroot=$WEBROOT backup=$BASE/.motor-lighting-backup-$TS"
          REMOTE

      # v3.0.0 起站点从「单页 hash 导航」改为「每节一个独立 URL」，`/basis`、`/caveats`
      # 这类深链接必须回退到 index.html，否则刷新 / 直接粘贴链接就是 404。
      # 站点配置不在仓库里（机器上的 nginx conf），只能借部署通道就地改写：
      # 脚本幂等（已有回退直接跳过），改动前备份，nginx -t 不过会自动还原。
      - name: Ensure SPA fallback in nginx
        shell: bash
        run: |
          set -euo pipefail
          ssh $SSH_OPTS "$LH_USER@$LH_HOST" bash -s -- "$CANONICAL_HOST" <<'REMOTE'
          set -euo pipefail
          HOST="$1"
          # server_name 里不一定写 www.，用去掉前缀的域名做主匹配键（它是带 www 形式的后缀）
          BARE="${HOST#www.}"

          # 配置位置各机器不同（sites-available/x、conf.d/x.conf…），用 `nginx -T` 的
          # 「# configuration file」分隔标记反查真正服务本站的文件，不写死路径。
          # 该行末尾带冒号，$4 要把 `:` 去掉；80 与 443 若分文件则都会被列出。
          # 匹配必须按 server_name 的 token 精确比对：用 index() 做子串匹配时
          # `x.motor-lighting.power-knowledge.tech.evil.com` 也会命中。
          FILES=$(nginx -T 2>/dev/null | awk -v h="$HOST" -v b="$BARE" '
            /^# configuration file / { f = $4; sub(/:$/, "", f) }
            index($0, "server_name") {
              n = split($0, a, /[ \t]+/)
              for (i = 1; i <= n; i++) {
                t = a[i]; gsub(/;/, "", t)
                if (t == h || t == b) { print f; break }
              }
            }
          ' | sort -u)
          test -n "$FILES" || { echo "ERROR: no nginx server block serving $BARE"; exit 1; }
          echo "matched confs:"; echo "$FILES"

          CHANGED=0
          for RAW in $FILES; do
            # sites-enabled/* 通常是指向 sites-available/* 的软链：sed -i 会把软链换成
            # 普通文件、与源文件脱钩，cp -a 也会复制成软链导致备份无效。
            # 一律解引用到真实文件再改，软链自然跟着生效。
            CONF=$(readlink -f "$RAW")
            echo "--- $RAW -> $CONF ---"
            grep -n -E 'try_files|location [^ ]+ \{|server_name' "$CONF" || true

            if grep -q 'try_files \$uri \$uri/ /index.html' "$CONF"; then
              echo "  already has SPA fallback, skip"
              continue
            fi

            BAK="$CONF.bak.$(date -u +%Y%m%dT%H%M%SZ)"
            cp -p "$CONF" "$BAK"
            echo "  backup: $BAK"

            # ① try_files 末端 `=404` → `/index.html`
            sed -i 's|try_files \$uri \$uri/ =404;|try_files $uri $uri/ /index.html;|g' "$CONF"

            # ② 静态目录保留真 404：否则旧缓存页面请求已删除的 hash 文件时，
            #    会拿到 200 text/html，浏览器报 MIME 错误而不是干净的 404。
            if ! grep -q 'location \^~ /assets/' "$CONF"; then
              awk '
                !done && /location[ \t]+\/[ \t]*\{/ {
                  print "    location ^~ /assets/ { try_files $uri =404; }"
                  print "    location ^~ /img/    { try_files $uri =404; }"
                  print ""
                  done = 1
                }
                { print }
              ' "$CONF" > "$CONF.new" && mv "$CONF.new" "$CONF"
              echo "  added static 404 guards for /assets/ and /img/"
            fi

            if ! grep -q 'try_files \$uri \$uri/ /index.html' "$CONF"; then
              echo "  ERROR: rewrite did not take effect, restoring"
              cp -p "$BAK" "$CONF"
              exit 1
            fi
            CHANGED=$((CHANGED + 1))
          done

          if [ "$CHANGED" = "0" ]; then
            echo "SPA_FALLBACK_OK (already configured)"
            exit 0
          fi

          if ! nginx -t; then
            echo "ERROR: nginx -t failed, restoring every backup"
            for RAW in $FILES; do
              CONF=$(readlink -f "$RAW")
              LAST=$(ls -1t "$CONF".bak.* 2>/dev/null | head -1 || true)
              [ -n "$LAST" ] && cp -p "$LAST" "$CONF"
            done
            nginx -t && systemctl reload nginx
            exit 1
          fi
          systemctl reload nginx
          echo "SPA_FALLBACK_OK (rewritten $CHANGED file(s))"
          REMOTE

      - name: Verify deployed artifact (fingerprint + version + HTTP)
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SHA=$(ssh $SSH_OPTS "$LH_USER@$LH_HOST" \
            "cd $LH_ROOT && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1")
          echo "local  tree = $LOCAL_SHA"
          echo "remote tree = $REMOTE_SHA"
          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "::error::deployed artifact fingerprint mismatch"
            exit 1
          fi
          DEPLOYED_VERSION=$(ssh $SSH_OPTS "$LH_USER@$LH_HOST" "cat $LH_ROOT/.deployed-version")
          echo "deployed version = $DEPLOYED_VERSION"
          if ! printf '%s' "$DEPLOYED_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::.deployed-version is not a SemVer triple"
            exit 1
          fi
          CODE=$(ssh $SSH_OPTS "$LH_USER@$LH_HOST" \
            "curl -sS -o /dev/null -w '%{http_code}' -H 'Host: $CANONICAL_HOST' http://127.0.0.1/")
          echo "health: http://127.0.0.1/ (Host=$CANONICAL_HOST) -> $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::health check did not return 200"
            exit 1
          fi
          # v3.0.0：11 个导航项各有独立 URL，全部依赖 SPA 回退。
          # 只要有一条不是 200，就说明 nginx 改写出问题（用户刷新即 404），必须阻断发布。
          ROUTE_OUT=$(ssh $SSH_OPTS "$LH_USER@$LH_HOST" bash -s -- "$CANONICAL_HOST" <<'REMOTE'
          for p in / /basis /screen /paths /tables /workflow /test /control /pitfalls /quiz /caveats; do
            printf '%s %s\n' "$p" "$(curl -sS -o /dev/null -w '%{http_code}' -H "Host: $1" "http://127.0.0.1$p")"
          done
          # 静态守卫的负向对照：缺失的 hash 资源必须是真 404，而不是回退出的 index.html
          printf '%s %s\n' "/assets/nonexistent.js" "$(curl -sS -o /dev/null -w '%{http_code}' -H "Host: $1" 'http://127.0.0.1/assets/nonexistent.js')"
          REMOTE
          )
          echo "--- route check ---"
          echo "$ROUTE_OUT"
          BAD=$(printf '%s\n' "$ROUTE_OUT" | awk '$1 != "/assets/nonexistent.js" && $2 != 200')
          if [ -n "$BAD" ]; then
            echo "::error::some routes did not return 200 after SPA fallback"
            exit 1
          fi
          GUARD=$(printf '%s\n' "$ROUTE_OUT" | awk '$1 == "/assets/nonexistent.js" { print $2 }')
          if [ "$GUARD" != "404" ]; then
            echo "::error::/assets/ guard should return 404 but returned $GUARD"
            exit 1
          fi
          ROUTES_OK=$(printf '%s\n' "$ROUTE_OUT" | awk '$2 == 200' | wc -l | tr -d ' ')
          echo "routes ok: $ROUTES_OK / 11 (+ /assets/ guard 404)"
          echo "DEPLOY_VERIFIED tree=$REMOTE_SHA version=$DEPLOYED_VERSION http=$CODE"
          {
            echo "## Deployment verified"
            echo ""
            echo "| check | value |"
            echo "| --- | --- |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| artifact tree | \`$REMOTE_SHA\` |"
            echo "| deployed version | \`$DEPLOYED_VERSION\` |"
            echo "| health (Host header) | HTTP $CODE |"
            echo "| routes (11, SPA fallback) | $ROUTES_OK / 11 OK |"
            echo "| webroot | \`$LH_ROOT\` |"
          } >> "$GITHUB_STEP_SUMMARY"
