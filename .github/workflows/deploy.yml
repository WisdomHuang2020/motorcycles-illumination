name: Deploy · motorcycles illumination

# push main 自动部署；纯文档 / 版本 / 审计脚本变更不触发。
# DNS 与证书就绪前本工作流仍可部署，健康检查用 Host 头回环，不依赖公网解析。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'VERSION'
      - 'scripts/**'
  workflow_dispatch:

concurrency:
  group: deploy-motor-lighting
  cancel-in-progress: false

env:
  # 仓库为 public，服务器地址与登录用户不写明文，一律走 Secrets
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_WEBROOT: /var/www/motor-lighting
  CANONICAL_HOST: www.motor-lighting.power-knowledge.tech

jobs:
  deploy:
    name: Build → upload → atomic switch → verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build artifact and compute tree fingerprint
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist site.tar.gz
          mkdir -p dist
          cp -a index.html assets dist/
          find dist -type d -name '.playwright-cli' -prune -exec rm -rf {} +
          find dist -type f -name '*.log' -delete
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1) > dist.sha256
          tar -czf site.tar.gz -C dist .
          echo "LOCAL_SHA=$(cat dist.sha256)" >> "$GITHUB_ENV"
          echo "artifact: $(find dist -type f | wc -l) files, $(du -sh dist | cut -f1), tree=$(cat dist.sha256)"

      - name: Prepare SSH key
        env:
          # 多行私钥必须经 env 注入；直接写进 run 脚本文本会破坏 shell 语法
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo "::error::secret DEPLOY_HOST is missing"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "::error::secret DEPLOY_USER is missing"; exit 1; }
          test -n "$DEPLOY_KEY"  || { echo "::error::secret DEPLOY_SSH_KEY is missing"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          echo "SSH_OPTS=-i $HOME/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15" >> "$GITHUB_ENV"

      - name: Upload tarball
        shell: bash
        run: |
          set -euo pipefail
          scp $SSH_OPTS site.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/md35-site.tar.gz"
          echo "uploaded sha256=$(sha256sum site.tar.gz | cut -d' ' -f1)"

      - name: Atomic switch on Lighthouse
        shell: bash
        run: |
          set -euo pipefail
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          WEBROOT=/var/www/motor-lighting
          STAGE=$(mktemp -d /var/www/.md35-stage.XXXXXX)
          trap 'rm -rf "$STAGE"' EXIT
          tar -xzf /tmp/md35-site.tar.gz -C "$STAGE"
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          if [ -d "$WEBROOT" ]; then
            cp -a "$WEBROOT" "/var/www/.md35-backup-$TS"
            mv "$WEBROOT" "$WEBROOT.old"
          fi
          mv "$STAGE" "$WEBROOT"
          chown -R www-data:www-data "$WEBROOT"
          chmod -R a=rX,u+w "$WEBROOT"
          nginx -t
          systemctl reload nginx
          rm -f /tmp/md35-site.tar.gz
          echo "SWITCH_OK webroot=$WEBROOT backup=/var/www/.md35-backup-$TS"
          REMOTE

      - name: Verify deployed artifact (fingerprint + HTTP)
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SHA=$(ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd $DEPLOY_WEBROOT && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1")
          echo "local  tree = $LOCAL_SHA"
          echo "remote tree = $REMOTE_SHA"
          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "::error::deployed artifact fingerprint mismatch"
            exit 1
          fi
          CODE=$(ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "curl -sS -o /dev/null -w '%{http_code}' -H 'Host: $CANONICAL_HOST' http://127.0.0.1/")
          echo "health: http://127.0.0.1/ (Host=$CANONICAL_HOST) -> $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::health check did not return 200"
            exit 1
          fi
          echo "DEPLOY_VERIFIED tree=$REMOTE_SHA http=$CODE"
          {
            echo "## Deployment verified"
            echo ""
            echo "| check | value |"
            echo "| --- | --- |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| artifact tree | \`$REMOTE_SHA\` |"
            echo "| health (Host header) | HTTP $CODE |"
            echo "| webroot | \`$DEPLOY_WEBROOT\` |"
          } >> "$GITHUB_STEP_SUMMARY"
