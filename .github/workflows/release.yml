name: Create Release

# 推 tag 不会自动创建 GitHub Release（已实测）。本工作流用 Actions 自带的
# GITHUB_TOKEN 补齐，无需任何用户 PAT，也不需要仓库里存密钥。
#
# 触发：push tag v* / 手动 dispatch 补建历史 tag 的 Release。
# 幂等：已存在同名 Release 则跳过，不把重跑变成红灯。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要为其创建 Release 的 tag（留空则用当前 ref）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag name
        id: resolve
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
            || { echo "::error::tag '$TAG' 不存在"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "解析到 tag: $TAG"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # 发版说明以 CHANGELOG.md 里该版本段落为准 —— 它是仓库内的发版记录，
          # 内容完整且与 VERSION 同步。另外两条路都不可靠：
          #   · `git log -1 <tag>` 只拿到最后一笔 commit 的 message，两笔提交的发版
          #     就只剩一条补丁说明（v3.0.0 实测如此）；
          #   · `git tag -l --format='%(contents)'` 在 actions/checkout 取到的 tag
          #     引用上会退化成 commit message（annotated 对象没保留下来）。
          NOTES=$(awk -v v="$TAG" '
            index($0, "## " v " ") == 1 { f = 1; next }
            f && index($0, "## ") == 1 { exit }
            f { print }
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::notice::CHANGELOG 无 $TAG 段落，回退到 tag 正文 / commit message"
            NOTES=$(git tag -l --format='%(contents)' "$TAG")
            if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
              NOTES=$(git log -1 --pretty=%B "$TAG")
            fi
          fi
          printf '%s\n' "$NOTES" > /tmp/notes.md
          # 已存在则更新正文而不是直接跳过：改了发版说明的生成方式后，
          # 重新 dispatch 就能把历史 Release 的内容一并修正过来。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/notes.md
            echo "::notice::Release $TAG 已存在，正文已更新"
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md --verify-tag
          echo "::notice::Release $TAG 创建完成"
